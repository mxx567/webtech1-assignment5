<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-do list</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container page" >
        <div class="row g-5 mt-5">
            <section class="col-md-6">
                <h1 class="page-title">To-do list</h1>
                <ul id="taskList" class="list-group"></ul>
            </section>
            <section class="col-md-6">
                <h2 class="page-title">Add new task</h2>
                <form id="taskForm" class="task-form">
                    <div class="mb-3">
                        <label for="taskTitle" class="form-label">* Title</label>
                        <input id="taskTitle" type="text" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="taskDescription" class="form-label">* Description</label>
                        <textarea id="taskDescription" class="form-control" required></textarea>
                    </div>
                    <button class="btn btn-primary add-button" type="submit">Add task</button>
                </form>
            </section>
        </div>
    </main>

    <script src="task7.js" type="text/javascript"></script>
</body>
</html>
